  <rect x="0" y="0" width="1200" height="630" fill="url(#bg_radial)" />
  
  <defs>
    <radialGradient id="bg_radial" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="1" />
